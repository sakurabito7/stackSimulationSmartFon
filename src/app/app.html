<div class="app-container">
  <header class="app-header">
    <h1>株式投資シミュレーション</h1>
  </header>

  <main class="app-main">
    @if (currentView === 'config') {
      <app-start-config (start)="onStartSimulation($event)" (showHistory)="showHistory()"></app-start-config>
    }

    @if (currentView === 'history') {
      <app-history (back)="backFromHistory()"></app-history>
    }

    @if (currentView === 'simulation' && config) {
      <app-simulation [config]="config" (finish)="onFinishSimulation($event)"></app-simulation>
    }

    @if (currentView === 'result' && state && config) {
      <app-result [state]="state" [config]="config" [csvFileName]="csvFileName" (restart)="restart()" (retry)="retry()"></app-result>
    }
  </main>
</div>
