<div class="config-container">
  <h2>株式投資シミュレーション設定</h2>

  <form (ngSubmit)="onSubmit()" #configForm="ngForm">
    <div class="form-group">
      <label for="preloadFile">CSVファイル *</label>
      <select
        id="preloadFile"
        [(ngModel)]="selectedPreloadFile"
        name="preloadFile"
        (change)="onPreloadFileSelected()"
        [disabled]="isLoading"
        required>
        <option *ngFor="let file of preloadFiles" [value]="file.value">
          {{ file.label }}
        </option>
      </select>
      <small *ngIf="csvFile" class="file-name">
        ✓ {{ csvFile.name }}
      </small>
    </div>

    <div class="form-group">
      <label for="startDate">開始日 *</label>
      <input
        type="date"
        id="startDate"
        [(ngModel)]="startDate"
        name="startDate"
        required>
    </div>

    <div class="form-group">
      <label for="period">期間（日数） *</label>
      <input
        type="number"
        id="period"
        [(ngModel)]="period"
        name="period"
        min="1"
        max="1000"
        required>
    </div>

    <div class="form-group">
      <label for="initialCash">初期資金（円） *</label>
      <input
        type="number"
        id="initialCash"
        [(ngModel)]="initialCash"
        name="initialCash"
        (ngModelChange)="onInitialCashChange()"
        min="10000"
        step="10000"
        required>
    </div>

    <div class="form-group">
      <label for="tradeAmount">売買単位（円） *</label>
      <input
        type="number"
        id="tradeAmount"
        [(ngModel)]="tradeAmount"
        name="tradeAmount"
        min="10000"
        step="10000"
        required>
    </div>

    <div class="form-group">
      <label for="maxPositions">最大ポジション数 *</label>
      <input
        type="number"
        id="maxPositions"
        [(ngModel)]="maxPositions"
        name="maxPositions"
        min="1"
        max="20"
        required>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button
      type="submit"
      [disabled]="!csvFile || isLoading || !configForm.form.valid"
      class="submit-button">
      {{ isLoading ? '読み込み中...' : 'シミュレーション開始' }}
    </button>
  </form>

  <div class="info-section">
    <h3>使い方</h3>
    <ul>
      <li>株価データのCSVファイルを選択してください</li>
      <li>CSVフォーマット: 日付,始値,高値,安値,終値,出来高</li>
      <li>信用取引は3倍レバレッジ、証拠金30%で計算されます</li>
      <li>ロング/ショート両建て取引が可能です</li>
    </ul>
  </div>
</div>
