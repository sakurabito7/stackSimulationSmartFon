<div class="config-container">
  <h2>株式投資シミュレーション設定</h2>

  <form (ngSubmit)="onSubmit()" #configForm="ngForm">
    <div class="form-group">
      <label for="stockCode">銘柄コード入力</label>
      <div class="stock-code-input-group">
        <input
          type="text"
          id="stockCode"
          [(ngModel)]="stockCodeInput"
          name="stockCode"
          placeholder="例: 7203"
          (input)="onStockCodeInput()"
          [disabled]="isLoading"
          maxlength="10">
        <button
          type="button"
          (click)="searchByStockCode()"
          [disabled]="isLoading || !stockCodeInput"
          class="search-button">
          検索
        </button>
      </div>
      <div *ngIf="filteredFiles.length > 0 && showSuggestions" class="suggestions-dropdown">
        <div
          *ngFor="let file of filteredFiles"
          class="suggestion-item"
          (click)="selectSuggestion(file)">
          {{ file.label }}
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="preloadFile">CSVファイル *</label>
      <select
        id="preloadFile"
        [(ngModel)]="selectedPreloadFile"
        name="preloadFile"
        (change)="onPreloadFileSelected()"
        [disabled]="isLoading"
        required>
        <option *ngFor="let file of preloadFiles" [value]="file.value">
          {{ file.label }}
        </option>
      </select>
      <small *ngIf="csvFile" class="file-name">
        ✓ {{ csvFile.name }}
      </small>
    </div>

    <div class="form-row-3">
      <div class="form-group">
        <label for="startDate">開始日 *</label>
        <input
          type="date"
          id="startDate"
          [(ngModel)]="startDate"
          name="startDate"
          required>
      </div>

      <div class="form-group">
        <label for="period">期間（日数） *</label>
        <input
          type="number"
          id="period"
          [(ngModel)]="period"
          name="period"
          min="1"
          max="1000"
          required>
      </div>

      <div class="form-group">
        <label for="maxPositions">最大P数 *</label>
        <input
          type="number"
          id="maxPositions"
          [(ngModel)]="maxPositions"
          name="maxPositions"
          min="1"
          max="20"
          required>
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label for="initialCash">初期資金（円） *</label>
        <input
          type="number"
          id="initialCash"
          [(ngModel)]="initialCash"
          name="initialCash"
          (ngModelChange)="onInitialCashChange()"
          min="10000"
          step="10000"
          required>
      </div>

      <div class="form-group">
        <label for="tradeAmount">売買単位（円） *</label>
        <input
          type="number"
          id="tradeAmount"
          [(ngModel)]="tradeAmount"
          name="tradeAmount"
          min="10000"
          step="10000"
          required>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button
      type="submit"
      [disabled]="!csvFile || isLoading || !configForm.form.valid"
      class="submit-button">
      {{ isLoading ? '読み込み中...' : 'シミュレーション開始' }}
    </button>

    <button
      type="button"
      (click)="showHistory.emit()"
      class="history-button">
      履歴を見る
    </button>
  </form>

  <div class="info-section">
    <h3>使い方</h3>
    <ul>
      <li>株価データのCSVファイルを選択してください</li>
      <li>CSVフォーマット: 日付,始値,高値,安値,終値,出来高</li>
      <li>信用取引は3倍レバレッジ、証拠金30%で計算されます</li>
      <li>ロング/ショート両建て取引が可能です</li>
    </ul>
  </div>
</div>
